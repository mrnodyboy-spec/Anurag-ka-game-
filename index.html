<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Anurag Ki Game – Police Chase</title>

<style>
body{
  margin:0;
  overflow:hidden;
  font-family:Arial;
  background:#111;
}
#game{
  position:relative;
  width:100vw;
  height:100vh;
  background:#444;
}

/* highway */
#road{
  position:absolute;
  inset:0;
  background:
    linear-gradient(#777 0 0) center/6px 100% no-repeat,
    repeating-linear-gradient(
      to bottom,
      transparent 0 20px,
      #fff 20px 40px
    );
}

/* header */
#header{
  position:absolute;
  top:0;
  width:100%;
  padding:8px;
  background:#000;
  color:white;
  text-align:center;
  z-index:10;
}
#score,#level{
  position:absolute;
  top:60px;
  color:white;
  font-size:18px;
  z-index:10;
}
#score{left:10px;}
#level{right:10px;}

/* nitro UI */
#nitroBox{
  position:absolute;
  bottom:20px;
  right:15px;
  z-index:15;
  text-align:center;
}
#nitroBtn{
  padding:12px 16px;
  font-size:16px;
  border:none;
  border-radius:50%;
  background:#00e5ff;
  color:#000;
  font-weight:bold;
}
#nitroBar{
  width:60px;
  height:6px;
  background:#333;
  border-radius:5px;
  margin-top:6px;
  overflow:hidden;
}
#nitroFill{
  height:100%;
  width:100%;
  background:#00e5ff;
}

/* car */
#car{
  position:absolute;
  bottom:20px;
  width:55px;
  height:90px;
  background:url("car.png") center/cover no-repeat;
  z-index:5;
  transition:box-shadow 0.2s;
}
.boost{
  box-shadow:0 0 25px cyan;
}

/* obstacles */
.enemy{
  position:absolute;
  width:60px;
  height:100px;
  border-radius:10px;
  color:white;
  font-size:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
}
.bus{background:#c62828;}
.truck{background:#37474f;}
.auto{background:#2e7d32;}
.carv{background:#000;}
.police{
  background:#0d47a1;
  border:2px solid red;
  box-shadow:0 0 10px red;
}

/* overlays */
#start,#gameover{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.85);
  color:white;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:20;
}
button{
  padding:12px 25px;
  font-size:18px;
  border:none;
  border-radius:20px;
  margin-top:15px;
  cursor:pointer;
}
</style>
</head>

<body>

<div id="game">
  <div id="road"></div>

  <div id="header">
    <h2>🚗 ANURAG KI GAME</h2>
    <p>POLICE CHASE + NITRO ⚡</p>
  </div>

  <div id="score">Score: 0</div>
  <div id="level">Level: 1</div>

  <div id="car"></div>

  <!-- Nitro UI -->
  <div id="nitroBox">
    <button id="nitroBtn">⚡</button>
    <div id="nitroBar"><div id="nitroFill"></div></div>
  </div>

  <div id="start">
    <h1>🏁 Highway Escape</h1>
    <button onclick="startGame()">START</button>
  </div>

  <div id="gameover" style="display:none">
    <h1>🚓 Busted!</h1>
    <p id="final"></p>
    <button onclick="location.reload()">RESTART</button>
  </div>
</div>

<audio id="engine" src="engine.mp3" loop></audio>

<script>
const car=document.getElementById("car");
const scoreEl=document.getElementById("score");
const levelEl=document.getElementById("level");
const engine=document.getElementById("engine");
const nitroFill=document.getElementById("nitroFill");

let carX=window.innerWidth/2-25;
let score=0;
let speed=4;
let level=1;
let playing=false;

/* nitro */
let nitro=100;
let boosting=false;

function startGame(){
  document.getElementById("start").style.display="none";
  engine.play();
  playing=true;
}

/* crash */
function crash(){
  playing=false;
  engine.pause();
  if(navigator.vibrate){
    navigator.vibrate([200,100,200,100,300]);
  }
  document.getElementById("gameover").style.display="flex";
  document.getElementById("final").innerText=
    "Score: "+score+" | Level: "+level;
}

/* obstacles */
const vehicles=[
  {name:"BUS",cls:"bus"},
  {name:"TRUCK",cls:"truck"},
  {name:"AUTO",cls:"auto"},
  {name:"CAR",cls:"carv"}
];

setInterval(()=>{
  if(!playing) return;
  let v=vehicles[Math.floor(Math.random()*vehicles.length)];
  let e=document.createElement("div");
  e.className="enemy "+v.cls;
  e.innerText=v.name;
  e.style.left=Math.random()*(window.innerWidth-70)+"px";
  e.style.top="-120px";
  game.appendChild(e);

  let move=setInterval(()=>{
    e.style.top=(e.offsetTop+speed)+"px";

    if(
      e.offsetTop+100>car.offsetTop &&
      e.offsetLeft<carX+55 &&
      e.offsetLeft+60>carX
    ){
      crash();
    }

    if(e.offsetTop>window.innerHeight){
      clearInterval(move);
      e.remove();
      score++;
      scoreEl.innerText="Score: "+score;

      if(score%10===0){
        level++;
        speed++;
        levelEl.innerText="Level: "+level;
      }
    }
  },20);
},1200);

/* police chase */
setInterval(()=>{
  if(!playing || level<2) return;
  let p=document.createElement("div");
  p.className="enemy police";
  p.innerText="POLICE";
  p.style.left=carX+"px";
  p.style.top="-150px";
  game.appendChild(p);

  let move=setInterval(()=>{
    p.style.top=(p.offsetTop+speed+1)+"px";

    if(
      p.offsetTop+100>car.offsetTop &&
      p.offsetLeft<carX+55 &&
      p.offsetLeft+60>carX
    ){
      crash();
    }
    if(p.offsetTop>window.innerHeight){
      clearInterval(move);
      p.remove();
    }
  },20);
},4000);

/* nitro boost */
document.getElementById("nitroBtn").addEventListener("click",()=>{
  if(!playing || nitro<=0 || boosting) return;

  boosting=true;
  speed+=4;
  car.classList.add("boost");

  let use=setInterval(()=>{
    nitro-=2;
    nitroFill.style.width=nitro+"%";
    if(nitro<=0){
      clearInterval(use);
      stopBoost();
    }
  },100);

  setTimeout(stopBoost,2500);
});

function stopBoost(){
  if(!boosting) return;
  boosting=false;
  speed-=4;
  car.classList.remove("boost");
}

/* nitro recharge */
setInterval(()=>{
  if(!boosting && nitro<100){
    nitro+=1;
    nitroFill.style.width=nitro+"%";
  }
},200);

/* tap control */
game.addEventListener("click",e=>{
  if(!playing) return;
  if(e.clientX<window.innerWidth/2) carX-=40;
  else carX+=40;
  carX=Math.max(0,Math.min(window.innerWidth-55,carX));
  car.style.left=carX+"px";
});
</script>

</body>
</html>
